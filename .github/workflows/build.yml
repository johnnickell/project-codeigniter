name: Build

on:
  push:
    branches: [develop, main, 'release/**']
  pull_request:
    branches: [develop, main, 'release/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare runtime
        run: ./bin/up
      - name: Install locked dependencies
        run: ./bin/composer install --no-interaction --prefer-dist --no-progress
      - name: Canonical gate
        run: ./bin/build
      - name: Stop runtime
        if: always()
        run: ./bin/down
